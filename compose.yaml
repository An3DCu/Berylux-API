# PostgreSQL, and the API itself under the "app" profile.
#   docker compose --profile app up --build   runs both
#   ./gradlew bootRun                         starts only the database (Spring Boot's Compose support)
# Both answer only on this machine (127.0.0.1); passwords come from .env, never from here.
name: berylux-api

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and fill it in}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and fill it in}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
