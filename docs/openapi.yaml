openapi: 3.1.0
info:
  description: "Accounts, sync and the weekly leaderboard for the Berylux app."
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Berylux API
  version: 0.2.0
servers:
- description: Generated server url
  url: http://localhost
paths:
  /account:
    delete:
      operationId: delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
        required: true
      responses:
        "204":
          description: "Gone: the account, its profile, cases and tokens"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The password is missing
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "No access token, or the password is wrong"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many tries for this account; `Retry-After` says how many
            seconds to wait
      security:
      - bearer: []
      summary: Delete the account and everything in it
      tags:
      - Accounts
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: "A new pair of tokens, in a new chain"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The email or the password is missing
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The same answer for a wrong password and an unknown email
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many tries from this address or for this email; `Retry-After`
            says how many seconds to wait
      summary: Sign in with an email and a password
      tags:
      - Accounts
  /auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "204":
          content:
            '*/*':
              schema:
                type: object
          description: "Done, whether or not the token was still in use"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The refresh token is missing
        "401":
          description: "No access token, or one that has run out"
      security:
      - bearer: []
      summary: End this phone's chain of refresh tokens
      tags:
      - Accounts
  /auth/refresh:
    post:
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: A new pair; the refresh token sent stops working
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unknown, expired, ended or already used: sign in again"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many tries from this address; `Retry-After` says how many
            seconds to wait
      summary: Trade a refresh token for the next pair
      tags:
      - Accounts
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                type: object
          description: "The account exists, and these are its first tokens"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Each field that's wrong, under `problems`, and what's wrong\
            \ with it"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The email can't be used
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: The body is over 8 KiB
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Too many tries from this address; `Retry-After` says how many
            seconds to wait
      summary: "Make an account with the guest's profile, and sign in"
      tags:
      - Accounts
components:
  schemas:
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type:
          - string
          - "null"
          description: "Asked again: an access token alone can't delete an account"
      required:
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type:
          - string
          - "null"
          example: player@example.com
        password:
          type:
          - string
          - "null"
      required:
      - email
      - password
    Problem:
      type: object
      description: An RFC 9457 problem detail
      properties:
        instance:
          type:
          - string
          - "null"
          description: The path that was called
        problems:
          type:
          - object
          - "null"
          additionalProperties:
            type: string
          description: "Only on a 400: each wrong field and what's wrong with it"
          example:
            password: too_short
            profile.dayStartHour: out_of_range
        status:
          type: integer
          format: int32
          example: 400
        title:
          type: string
          example: Some fields are wrong
    ProfileFields:
      type: object
      properties:
        dayStartHour:
          type:
          - integer
          - "null"
          format: int32
          example: 4
          maximum: 23
          minimum: 0
        name:
          type:
          - string
          - "null"
          example: Marlowe
          maxLength: 20
        pickSeed:
          type:
          - integer
          - "null"
          format: int64
          description: Drives the daily picks and the rivals
        sigilSeed:
          type:
          - integer
          - "null"
          format: int64
          description: Draws the sigil
        timeZone:
          type:
          - string
          - "null"
          description: An IANA time zone
          example: Europe/Sarajevo
      required:
      - dayStartHour
      - name
      - pickSeed
      - sigilSeed
      - timeZone
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type:
          - string
          - "null"
      required:
      - refreshToken
    RegisterRequest:
      type: object
      properties:
        email:
          type:
          - string
          - "null"
          example: player@example.com
          maxLength: 254
        password:
          type:
          - string
          - "null"
          description: "Counted in characters, with no rules about which ones"
          maxLength: 128
          minLength: 10
        profile:
          oneOf:
          - $ref: "#/components/schemas/ProfileFields"
          - type: "null"
      required:
      - email
      - password
      - profile
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
